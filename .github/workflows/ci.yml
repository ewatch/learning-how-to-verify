name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run check          # types (astro check, TypeScript strict)
      - run: npm test               # data completeness + engine unit/property tests
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e       # smoke + accessibility, both languages, desktop + mobile
        env: { CI: '1' }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: test-results/ }

  licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: node scripts/check-licenses.ts
        env: { GH_TOKEN: '${{ github.token }}' }

  guide-outputs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Install TLA+ tools and Dafny (versions the guides were recorded with)
        run: |
          curl -fsSL -o tla2tools.jar https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          dotnet tool install --global dafny --version 4.11.0
      - run: ./scripts/check-guide-outputs.sh
        env: { TLA2TOOLS: tla2tools.jar }

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run test:mutation  # StrykerJS on the simulator engines; breaks below the threshold
